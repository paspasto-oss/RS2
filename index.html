<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS2 - Spektra Install</title>
</head>
<body>
  <div id="rs2-loader" style="font-family:Arial,sans-serif;padding:24px;text-align:center">Načítavam RS2…</div>
  <script>
  (async () => {
    const sourceUrl = './rs2-app.html?v=20260917-ocr4';
    const closeScript = '</scr' + 'ipt>';
    try {
      const response = await fetch(sourceUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      let html = await response.text();

      // 2) Firebase Auth: počkáme na obnovenie persistovaného prihlásenia.
      //    Ak používateľ stále nie je prihlásený, nový pokus dovolíme najviac raz za 30 s.
      const authStart = '    initAuth();\n\n    onAuthStateChanged(auth, async (u) => {';
      const authSafe = `    setTimeout(async () => {
        if (typeof auth.authStateReady === 'function') await auth.authStateReady();
        if (auth.currentUser) return;
        const throttleKey = 'rs2_auth_last_attempt';
        const lastAttempt = Number(localStorage.getItem(throttleKey) || 0);
        if (Date.now() - lastAttempt < 30000) {
            const statusEl = document.getElementById('cloud-status-text');
            if (statusEl) statusEl.innerHTML = '<span class="status-off">Cloud: ochrana pred limitom požiadaviek ⏳</span>';
            return;
        }
        localStorage.setItem(throttleKey, String(Date.now()));
        initAuth();
    }, 250);

    onAuthStateChanged(auth, async (u) => {`;
      if (html.includes(authStart)) {
        html = html.replace(authStart, authSafe);
      } else {
        console.warn('RS2: Firebase auth marker nebol nájdený.');
      }

      // 3) Ochrana cloudových tlačidiel proti rýchlemu dvojkliku.
      const clickGuard = `
<script>
document.addEventListener('click', (event) => {
  const button = event.target && event.target.closest ? event.target.closest('.btn-archive-save, .btn-archive-view') : null;
  if (!button) return;
  const now = Date.now();
  const lockedUntil = Number(button.dataset.rs2LockedUntil || 0);
  if (now < lockedUntil) {
    event.preventDefault();
    event.stopImmediatePropagation();
    return;
  }
  button.dataset.rs2LockedUntil = String(now + 2000);
}, true);
` + closeScript;

      html = html.replace('</body>', clickGuard + '\n</body>');

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error('RS2 loader chyba:', error);
      document.getElementById('rs2-loader').innerHTML =
        '<b>RS2 sa nepodarilo načítať.</b><br><br>' +
        '<a href="rs2-app.html">Otvoriť pôvodnú aplikáciu</a>';
    }
  })();
  </script>
</body>
</html>
