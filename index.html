<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23D60000'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Arial,sans-serif' font-weight='900' font-size='40' fill='white'%3ERS2%3C/text%3E%3C/svg%3E">
  <title>RS2 - Spektra Install</title>
</head>
<body>
  <div id="rs2-loader" style="font-family:Arial,sans-serif;padding:24px;text-align:center">Načítavam RS2…</div>
  <script>
  (async () => {
    const sourceUrl = './rs2-app-v2.html?v=20261018-document-photo';
    const closeScript = '</scr' + 'ipt>';
    try {
      const response = await fetch(sourceUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      let html = await response.text();

      // 1) Cloudový archív patrí na koniec formulára, za ostatné akcie.
      //    Presúvame pôvodný blok bez zmeny obsluhy tlačidiel alebo stavu cloudu.
      const archiveBlock = `        <div class="section-title">Cloudové úložisko</div>
        <button class="btn-archive-save" onclick="saveToCloudArchive()">💾 Uložiť do archívu</button>
        <button class="btn-archive-view" onclick="openArchive()">📂 Otvoriť archív</button>
        <div class="cloud-status" id="cloud-status-text">Pripájanie k cloudu...</div>
`;
      const controlsEnd = '    </section>\n\n    <section class="preview-scroll-wrapper">';
      if (html.includes(archiveBlock) && html.includes(controlsEnd)) {
        html = html.replace(archiveBlock, '');
        html = html.replace(controlsEnd, '\n' + archiveBlock + controlsEnd);
      } else {
        console.warn('RS2: Blok archívu alebo koniec formulára nebol nájdený.');
      }

      // 2) Firebase Auth: počkáme na obnovenie persistovaného prihlásenia.
      //    Ak používateľ stále nie je prihlásený, nový pokus dovolíme najviac raz za 30 s.
      const authStart = '    initAuth();\n\n    onAuthStateChanged(auth, async (u) => {';
      const authSafe = `    setTimeout(async () => {
        if (typeof auth.authStateReady === 'function') await auth.authStateReady();
        if (auth.currentUser) return;
        const throttleKey = 'rs2_auth_last_attempt';
        const lastAttempt = Number(localStorage.getItem(throttleKey) || 0);
        if (Date.now() - lastAttempt < 30000) {
            const statusEl = document.getElementById('cloud-status-text');
            if (statusEl) statusEl.innerHTML = '<span class="status-off">Cloud: ochrana pred limitom požiadaviek ⏳</span>';
            return;
        }
        localStorage.setItem(throttleKey, String(Date.now()));
        initAuth();
    }, 250);

    onAuthStateChanged(auth, async (u) => {`;
      if (html.includes(authStart)) {
        html = html.replace(authStart, authSafe);
      } else {
        console.warn('RS2: Firebase auth marker nebol nájdený.');
      }

      // 3) Ochrana cloudových tlačidiel proti rýchlemu dvojkliku.
      const clickGuard = `
<script>
document.addEventListener('click', (event) => {
  const button = event.target && event.target.closest ? event.target.closest('.btn-archive-save, .btn-archive-view') : null;
  if (!button) return;
  const now = Date.now();
  const lockedUntil = Number(button.dataset.rs2LockedUntil || 0);
  if (now < lockedUntil) {
    event.preventDefault();
    event.stopImmediatePropagation();
    return;
  }
  button.dataset.rs2LockedUntil = String(now + 2000);
}, true);
` + closeScript;

      html = html.replace('</body>', clickGuard + '<script src="./spektra-servis-bridge.js?v=20261018-1">' + closeScript + '\n</body>');

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error('RS2 loader chyba:', error);
      document.getElementById('rs2-loader').innerHTML =
        '<b>RS2 sa nepodarilo načítať.</b><br><br>' +
        '<a href="rs2-app.html">Otvoriť pôvodnú aplikáciu</a>';
    }
  })();
  </script>
</body>
</html>
